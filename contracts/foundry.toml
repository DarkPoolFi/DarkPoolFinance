# DarkpoolFi contracts. Dependencies (not committed): git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "cancun" # Robinhood Chain supports PUSH0, TSTORE and MCOPY (probed on 4663 and 46630)
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../circuits/target" }]

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
